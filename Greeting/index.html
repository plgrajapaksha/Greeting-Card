<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>3D AR Birthday Greeting Card</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: #c2185b;
      color: white;
      padding: 12px 22px;
      border-radius: 25px;
      font-size: 15px;
      z-index: 10;
      white-space: nowrap;
    }

    #instruction {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: #c2185b;
      padding: 10px 15px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 10;
    }
  </style>
</head>

<body>

  <div id="status">Looking for your birthday card...</div>
  <div id="instruction">Tap the blue ball to change its colour!</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker preset="hiro" id="hiroMarker">

      <!-- MAIN GREETING CARD -->
      <a-box
        position="0 0.04 0"
        width="1.6"
        height="0.08"
        depth="1.1"
        color="#FFF0F5">
      </a-box>

      <!-- CARD INNER PANEL -->
      <a-box
        position="0 0.09 0"
        width="1.45"
        height="0.025"
        depth="0.95"
        color="#FFE4E1">
      </a-box>

      <!-- GREETING TITLE -->
      <a-text
        value="HAPPY BIRTHDAY!"
        position="0 0.16 0.35"
        rotation="-90 0 0"
        align="center"
        color="#C2185B"
        width="2.7">
      </a-text>

      <!-- GREETING MESSAGE -->
      <a-text
        value="Wishing You A Beautiful Day"
        position="0 0.16 0.17"
        rotation="-90 0 0"
        align="center"
        color="#8E2455"
        width="2">
      </a-text>

      <a-text
        value="May All Your Dreams Come True!"
        position="0 0.16 0.02"
        rotation="-90 0 0"
        align="center"
        color="#8E2455"
        width="1.8">
      </a-text>

      <a-text
        value="With Love!"
        position="0 0.16 -0.12"
        rotation="-90 0 0"
        align="center"
        color="#C2185B"
        width="1.5">
      </a-text>

      <!-- 3D BALLOON 1 -->
      <a-sphere
        position="-0.62 0.65 0.25"
        radius="0.12"
        color="#FF4081"
        animation="property: position; to: -0.62 0.8 0.25; dir: alternate; loop: true; dur: 1500">
      </a-sphere>

      <a-cylinder
        position="-0.62 0.38 0.25"
        radius="0.004"
        height="0.4"
        color="#777777">
      </a-cylinder>

      <!-- 3D BALLOON 2 -->
      <a-sphere
        position="0.62 0.65 0.25"
        radius="0.12"
        color="#2196F3"
        animation="property: position; to: 0.62 0.8 0.25; dir: alternate; loop: true; dur: 1800">
      </a-sphere>

      <a-cylinder
        position="0.62 0.38 0.25"
        radius="0.004"
        height="0.4"
        color="#777777">
      </a-cylinder>

      <!-- 3D BALLOON 3 -->
      <a-sphere
        position="0 0.8 -0.48"
        radius="0.12"
        color="#FFD700"
        animation="property: position; to: 0 0.95 -0.48; dir: alternate; loop: true; dur: 1300">
      </a-sphere>

      <a-cylinder
        position="0 0.53 -0.48"
        radius="0.004"
        height="0.4"
        color="#777777">
      </a-cylinder>

      <!-- BIRTHDAY CAKE BASE -->
      <a-cylinder
        position="0 0.27 -0.22"
        radius="0.22"
        height="0.16"
        color="#FFB6C1">
      </a-cylinder>

      <!-- CAKE CREAM -->
      <a-cylinder
        position="0 0.36 -0.22"
        radius="0.23"
        height="0.05"
        color="#FFFFFF">
      </a-cylinder>

      <!-- CAKE TOP -->
      <a-cylinder
        position="0 0.40 -0.22"
        radius="0.19"
        height="0.04"
        color="#FF69B4">
      </a-cylinder>

      <!-- CANDLE -->
      <a-cylinder
        position="0 0.51 -0.22"
        radius="0.018"
        height="0.17"
        color="#FFD700">
      </a-cylinder>

      <!-- CANDLE FLAME -->
      <a-sphere
        position="0 0.61 -0.22"
        radius="0.035"
        color="#FF9800"
        animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; loop: true; dur: 500">
      </a-sphere>

      <!-- GIFT BOX -->
      <a-box
        position="-0.42 0.24 -0.35"
        width="0.23"
        height="0.22"
        depth="0.23"
        color="#E91E63">
      </a-box>

      <!-- GIFT RIBBON -->
      <a-box
        position="-0.42 0.24 -0.35"
        width="0.05"
        height="0.24"
        depth="0.24"
        color="#FFD700">
      </a-box>

      <!-- DECORATIVE STAR -->
      <a-octahedron
        position="0.48 0.35 -0.35"
        radius="0.10"
        color="#FFD700"
        animation="property: rotation; to: 360 360 360; loop: true; dur: 3000">
      </a-octahedron>

      <!-- INTERACTIVE COLOUR CHANGING BALL -->
      <a-sphere
        id="magicBall"
        class="clickable"
        position="0.48 0.3 0.05"
        radius="0.11"
        color="#2196F3">
      </a-sphere>

      <!-- SMALL DECORATIVE HEARTS -->
      <a-sphere
        position="-0.30 0.30 0.40"
        radius="0.06"
        color="#F50057"
        animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; loop: true; dur: 900">
      </a-sphere>

      <a-sphere
        position="0.30 0.30 0.40"
        radius="0.06"
        color="#FF4081"
        animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; loop: true; dur: 1100">
      </a-sphere>

    </a-marker>

    <!-- CAMERA AND CLICK CURSOR -->
    <a-entity camera>
      <a-cursor
        raycaster="objects: .clickable"
        fuse="false"
        color="yellow">
      </a-cursor>
    </a-entity>

  </a-scene>

  <script>

    // MARKER STATUS
    const marker = document.querySelector("#hiroMarker");
    const status = document.querySelector("#status");

    marker.addEventListener("markerFound", function () {
      status.innerText = "Birthday Card Found! 🎉";
      status.style.background = "green";
    });

    marker.addEventListener("markerLost", function () {
      status.innerText = "Looking for your birthday card...";
      status.style.background = "#c2185b";
    });

    // BALL COLOUR INTERACTION
    const ball = document.querySelector("#magicBall");

    const colors = [
      "#2196F3",
      "#E91E63",
      "#4CAF50",
      "#FFD700",
      "#9C27B0",
      "#FF5722"
    ];

    let colorIndex = 0;

    ball.addEventListener("click", function () {
      colorIndex = (colorIndex + 1) % colors.length;
      ball.setAttribute("color", colors[colorIndex]);
    });

  </script>

</body>
</html>
